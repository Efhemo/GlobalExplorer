name: global_explorer
description: "A Flutter app for discovering geographic data, managing favorites, and consuming regional media."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3
  connectivity_plus: ^6.0.3
  pretty_dio_logger: ^1.4.0

  # Local Database
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Code Generation
  json_annotation: ^4.9.0

  # Image handling
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # UI Utilities
  shimmer: ^3.0.0
  url_launcher: ^6.3.0
  intl: ^0.20.2

  # Environment & DI
  flutter_dotenv: ^5.2.1
  get_it: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  drift_dev: ^2.23.1

  # Testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - .env
